name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-assets
          path: |
            dist
            package.json
            README.md
            LICENSE

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      
      # Clean Node environment for OIDC publishing
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # REMOVED registry-url to prevent setup-node from creating a broken .npmrc

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-assets

      # Manually configure registry scope WITHOUT auth token (OIDC handles auth)
      - name: Configure npm registry
        run: echo "@jgb-solutions:registry=https://registry.npmjs.org/" > .npmrc

      - name: Publish to npm
        run: npm publish --provenance --access public --ignore-scripts
